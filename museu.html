<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Les sales · Museu dels Compositors</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@700&family=Cinzel:wght@700&family=Abril+Fatface&family=Bebas+Neue&family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="museu.css">
<style>
  body { background:linear-gradient(#fbf7eeaa, #fbf7eedd), url(img/fons/passadis.jpg) center bottom / cover; }
  .sales { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr));
           gap:2.5vh clamp(10px,3vw,40px); }
  .num { font:600 .8em Fredoka, sans-serif; color:var(--soft); }
  .buit { font:700 clamp(28px,6vh,60px) Fredoka, sans-serif; color:#fff9; align-self:center; }
  @media (max-aspect-ratio: 3/4) {
    .sales { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(3, minmax(0,1fr)); gap:1.6vh 12px; }
  }
</style>
</head>
<body>
<nav class="banda"><a class="boto" href="index.html">← Entrada</a><span>Museu dels Compositors</span></nav>
<main>
  <h1>Tria una sala</h1>
  <p class="sub">Cada sala és una època de la història de la música.</p>
  <div class="sales" id="sales"></div>
</main>
<footer>© Javier Mateo García per a Aulatech · <a href="https://www.youtube.com/@lapautamusica" target="_blank" rel="noopener">La Pauta a YouTube</a></footer>
<script src="dades.js"></script>
<script>
// Una sala per època; al llenç, les figures dels compositors que ja hi són.
document.getElementById("sales").innerHTML = Object.keys(EPOQUES).map((e, i) => {
  const ids = Object.keys(COMPOSITORS).filter(id => COMPOSITORS[id].epoca === e);
  const llenc = ids.length ? ids.map(id => `<img src="img/${id}.png" alt="">`).join("") : `<span class="buit">?</span>`;
  const obre = ids.length > 0;
  return `<${obre ? "a" : "div"} class="quadre ${obre ? "" : "tancada"}" ${obre ? `href="epoca.html?e=${encodeURIComponent(e)}"` : ""}>
    <div class="marc"><div class="llenc" style="background:url(${fons(e)}) center/cover">${llenc}</div></div>
    <div class="placa"><span class="num">Sala ${i + 1}</span><b style="font-family:${LLETRES[e]}, Fredoka, serif">${e}</b><small>${obre ? ANYS[e] : "Aviat!"}</small></div>
  </${obre ? "a" : "div"}>`;
}).join("");
</script>
</body>
</html>
