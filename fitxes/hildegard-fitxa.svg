<text x="15" y="15" class="h1">Hildegard von Bingen · La figura</text>
<text x="195" y="15" class="h2" text-anchor="end">La Pauta · Compositors · Edat Mitjana</text>
<line x1="15" y1="18" x2="195" y2="18" class="rule"/>
<g id="peca"><image href="fitxes/hildegard-peca.png" x="34.60" y="26.58" width="54.79" height="246.84"/>
<text x="62.00" y="136.28" class="nom" style="font-size:4.05px">Hildegard von Bingen</text><text x="62.00" y="144.51" class="obra" style="font-size:4.122086037010335px">O virtus Sapientiae</text><g transform="rotate(180 62.00 162.47)"><text x="62.00" y="161.22" class="nom" style="font-size:4.05px">Hildegard von Bingen</text><text x="62.00" y="169.45" class="obra" style="font-size:4.4px">Edat Mitjana · 1098 – 1179</text></g><line x1="37.53" y1="150.00" x2="86.47" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.69710806697108,54 66.69710806697108,61 5,61" class="tab"/><rect x="0" y="0" width="71.69710806697108" height="54" fill="#fff"/><rect x="0" y="18" width="71.69710806697108" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.69710806697108" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">EDAT MITJANA</text><text x="19" y="30.4" class="dates">1098 – 1179</text><text x="68.69710806697108" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.84855403348554 9.0)"><rect x="0" y="14.8" width="71.69710806697108" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.84855403348554" y="8" class="lloc">Hildegard von Bingen</text><text x="35.84855403348554" y="12.2" class="esc2" text-anchor="middle">Bingen (Alemanya) · 1098 – 1179</text></g><rect x="0" y="0" width="71.69710806697108" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.69710806697108" y2="36" class="fold"/><line x1="0" y1="54" x2="71.69710806697108" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.69710806697108" y1="18" x2="71.69710806697108" y2="18" class="fold"/><line x1="7" y1="18" x2="64.69710806697108" y2="18" class="slit"/><text x="35.84855403348554" y="46.0" class="lbl">base (no es veu)</text><text x="35.84855403348554" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.69710806697108" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.69710806697108" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.69710806697108" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.69710806697108" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.29710806697108" r="3" class="num"/><text x="118.6" y="118.49710806697108" class="numt">1</text><text x="144" y="120.69710806697108" class="st1">Pinta-la</text><text x="144" y="125.89710806697109" class="st2">per davant i per darrere,</text><text x="144" y="130.0971080669711" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.89710806697107" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.89710806697107" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.49710806697107" r="3" class="num"/><text x="118.6" y="142.69710806697108" class="numt">2</text><text x="144" y="144.89710806697107" class="st1">Retalla-la</text><text x="144" y="150.09710806697106" class="st2">sencera, seguint</text><text x="144" y="154.29710806697105" class="st2">la línia negra.</text><rect x="114" y="161.0971080669711" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.0971080669711" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.69710806697108" r="3" class="num"/><text x="118.6" y="166.8971080669711" class="numt">3</text><text x="144" y="169.0971080669711" class="st1">Doblega i enganxa</text><text x="144" y="174.29710806697108" class="st2">per la línia de punts</text><text x="144" y="178.49710806697107" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.29710806697108" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.29710806697108" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.89710806697107" r="3" class="num"/><text x="118.6" y="191.0971080669711" class="numt">4</text><text x="144" y="193.29710806697108" class="st1">Munta el suport</text><text x="144" y="198.49710806697107" class="st2">talla la línia vermella</text><text x="144" y="202.69710806697105" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.49710806697107" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.49710806697107" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.09710806697106" r="3" class="num"/><text x="118.6" y="215.29710806697108" class="numt">5</text><text x="144" y="217.49710806697107" class="st1">Encaixa la figura</text><text x="144" y="222.69710806697105" class="st2">fes entrar la peana</text><text x="144" y="226.89710806697104" class="st2">al tall del suport.</text><rect x="114" y="233.69710806697108" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.69710806697108" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.29710806697108" r="3" class="num"/><text x="118.6" y="239.4971080669711" class="numt">6</text><text x="144" y="241.69710806697108" class="st1">Escaneja el QR</text><text x="144" y="246.89710806697107" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.09710806697106" class="st2">del suport.</text><rect x="114" y="257.8971080669711" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.8971080669711" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.4971080669711" r="3" class="num"/><text x="118.6" y="263.6971080669711" class="numt">7</text><text x="144" y="265.8971080669711" class="st1">Escolta l'obra!</text><text x="144" y="271.0971080669711" class="st2">i exposa la figura</text><text x="144" y="275.2971080669711" class="st2">amb tota la classe.</text>
<text x="105" y="292" class="foot">© Javier Mateo García per a Aulatech</text></svg>