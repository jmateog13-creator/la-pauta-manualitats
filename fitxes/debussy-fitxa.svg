<text x="114" y="109.69090909090909" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.69090909090909" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.69090909090909" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.69090909090909" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.29090909090908" r="3" class="num"/><text x="118.6" y="118.49090909090908" class="numt">1</text><text x="144" y="120.69090909090909" class="st1">Pinta-la</text><text x="144" y="125.89090909090909" class="st2">per davant i per darrere,</text><text x="144" y="130.0909090909091" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.89090909090908" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.89090909090908" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.49090909090907" r="3" class="num"/><text x="118.6" y="142.6909090909091" class="numt">2</text><text x="144" y="144.89090909090908" class="st1">Retalla-la</text><text x="144" y="150.09090909090907" class="st2">sencera, seguint</text><text x="144" y="154.29090909090905" class="st2">la línia negra.</text><rect x="114" y="161.0909090909091" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.0909090909091" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.6909090909091" r="3" class="num"/><text x="118.6" y="166.8909090909091" class="numt">3</text><text x="144" y="169.0909090909091" class="st1">Doblega i enganxa</text><text x="144" y="174.29090909090908" class="st2">per la línia de punts</text><text x="144" y="178.49090909090907" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.29090909090908" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.29090909090908" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.89090909090908" r="3" class="num"/><text x="118.6" y="191.0909090909091" class="numt">4</text><text x="144" y="193.29090909090908" class="st1">Munta el suport</text><text x="144" y="198.49090909090907" class="st2">talla la línia vermella</text><text x="144" y="202.69090909090906" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.4909090909091" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.4909090909091" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.0909090909091" r="3" class="num"/><text x="118.6" y="215.2909090909091" class="numt">5</text><text x="144" y="217.4909090909091" class="st1">Encaixa la figura</text><text x="144" y="222.6909090909091" class="st2">fes entrar la peana</text><text x="144" y="226.89090909090908" class="st2">al tall del suport.</text><rect x="114" y="233.6909090909091" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.6909090909091" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.29090909090908" r="3" class="num"/><text x="118.6" y="239.4909090909091" class="numt">6</text><text x="144" y="241.6909090909091" class="st1">Escaneja el QR</text><text x="144" y="246.89090909090908" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.09090909090907" class="st2">del suport.</text><rect x="114" y="257.8909090909091" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.8909090909091" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.4909090909091" r="3" class="num"/><text x="118.6" y="263.6909090909091" class="numt">7</text><text x="144" y="265.8909090909091" class="st1">Escolta l'obra!</text><text x="144" y="271.09090909090907" class="st2">i exposa la figura</text><text x="144" y="275.29090909090905" class="st2">amb tota la classe.</text>
