<svg viewBox="0 0 210 297" width="210mm" height="297mm">
<text x="15" y="15" class="h1">J. Dowland · La figura</text>
<text x="195" y="15" class="h2" text-anchor="end">La Pauta · Compositors · Renaixement</text>
<line x1="15" y1="18" x2="195" y2="18" class="rule"/>
<g id="peca"><image href="fitxes/dowland-peca.png" x="34.61" y="26.54" width="54.78" height="246.93"/>
<text x="62.00" y="136.26" class="nom" style="font-size:8.00px">J. Dowland</text><text x="62.00" y="144.50" class="obra" style="font-size:6.024350535540409px">Flow my tears</text><g transform="rotate(180 62.00 162.49)"><text x="62.00" y="161.24" class="nom" style="font-size:8.00px">J. Dowland</text><text x="62.00" y="169.49" class="obra" style="font-size:4.4px">Renaixement · 1563 – 1626</text></g><line x1="37.53" y1="150.00" x2="86.47" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.68354430379748,54 66.68354430379748,61 5,61" class="tab"/><rect x="0" y="0" width="71.68354430379748" height="54" fill="#fff"/><rect x="0" y="18" width="71.68354430379748" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.68354430379748" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">RENAIXEMENT</text><text x="19" y="30.4" class="dates">1563 – 1626</text><text x="68.68354430379748" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.84177215189874 9.0)"><rect x="0" y="14.8" width="71.68354430379748" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.84177215189874" y="8" class="lloc">J. Dowland</text><text x="35.84177215189874" y="12.2" class="esc2" text-anchor="middle">Anglaterra · Dinamarca · 1563 – 1626</text></g><rect x="0" y="0" width="71.68354430379748" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.68354430379748" y2="36" class="fold"/><line x1="0" y1="54" x2="71.68354430379748" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.68354430379748" y1="18" x2="71.68354430379748" y2="18" class="fold"/><line x1="7" y1="18" x2="64.68354430379748" y2="18" class="slit"/><text x="35.84177215189874" y="46.0" class="lbl">base (no es veu)</text><text x="35.84177215189874" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.68354430379748" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.68354430379748" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.68354430379748" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.68354430379748" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.28354430379747" r="3" class="num"/><text x="118.6" y="118.48354430379747" class="numt">1</text><text x="144" y="120.68354430379748" class="st1">Pinta-la</text><text x="144" y="125.88354430379748" class="st2">per davant i per darrere,</text><text x="144" y="130.08354430379748" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.88354430379746" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.88354430379746" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.48354430379746" r="3" class="num"/><text x="118.6" y="142.68354430379748" class="numt">2</text><text x="144" y="144.88354430379746" class="st1">Retalla-la</text><text x="144" y="150.08354430379745" class="st2">sencera, seguint</text><text x="144" y="154.28354430379744" class="st2">la línia negra.</text><rect x="114" y="161.08354430379748" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.08354430379748" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.68354430379748" r="3" class="num"/><text x="118.6" y="166.8835443037975" class="numt">3</text><text x="144" y="169.08354430379748" class="st1">Doblega i enganxa</text><text x="144" y="174.28354430379747" class="st2">per la línia de punts</text><text x="144" y="178.48354430379746" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.28354430379747" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.28354430379747" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.88354430379746" r="3" class="num"/><text x="118.6" y="191.08354430379748" class="numt">4</text><text x="144" y="193.28354430379747" class="st1">Munta el suport</text><text x="144" y="198.48354430379746" class="st2">talla la línia vermella</text><text x="144" y="202.68354430379745" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.4835443037975" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.4835443037975" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.08354430379748" r="3" class="num"/><text x="118.6" y="215.2835443037975" class="numt">5</text><text x="144" y="217.4835443037975" class="st1">Encaixa la figura</text><text x="144" y="222.68354430379748" class="st2">fes entrar la peana</text><text x="144" y="226.88354430379746" class="st2">al tall del suport.</text><rect x="114" y="233.68354430379748" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.68354430379748" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.28354430379747" r="3" class="num"/><text x="118.6" y="239.4835443037975" class="numt">6</text><text x="144" y="241.68354430379748" class="st1">Escaneja el QR</text><text x="144" y="246.88354430379746" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.08354430379745" class="st2">del suport.</text><rect x="114" y="257.88354430379746" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.88354430379746" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.4835443037975" r="3" class="num"/><text x="118.6" y="263.6835443037975" class="numt">7</text><text x="144" y="265.88354430379746" class="st1">Escolta l'obra!</text><text x="144" y="271.08354430379745" class="st2">i exposa la figura</text><text x="144" y="275.28354430379744" class="st2">amb tota la classe.</text>
<text x="105" y="292" class="foot">© Javier Mateo García per a Aulatech</text></svg>