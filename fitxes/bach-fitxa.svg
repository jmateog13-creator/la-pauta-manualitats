<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.91891891891892,54 66.91891891891892,61 5,61" class="tab"/><rect x="0" y="0" width="71.91891891891892" height="54" fill="#fff"/><rect x="0" y="18" width="71.91891891891892" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.91891891891892" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">BARROC</text><text x="19" y="30.4" class="dates">1685 – 1750</text><text x="68.91891891891892" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.95945945945946 9.0)"><rect x="0" y="14.8" width="71.91891891891892" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.95945945945946" y="8" class="lloc">J. S. Bach</text><text x="35.95945945945946" y="12.2" class="esc2" text-anchor="middle">Eisenach (Alemanya) · Leipzig · 1685 – 1750</text></g><rect x="0" y="0" width="71.91891891891892" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.91891891891892" y2="36" class="fold"/><line x1="0" y1="54" x2="71.91891891891892" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.91891891891892" y1="18" x2="71.91891891891892" y2="18" class="fold"/><line x1="7" y1="18" x2="64.91891891891892" y2="18" class="slit"/><text x="35.95945945945946" y="46.0" class="lbl">base (no es veu)</text><text x="35.95945945945946" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.91891891891892" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.91891891891892" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.91891891891892" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.91891891891892" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.51891891891891" r="3" class="num"/><text x="118.6" y="118.71891891891892" class="numt">1</text><text x="144" y="120.91891891891892" class="st1">Pinta-la</text><text x="144" y="126.11891891891892" class="st2">per davant i per darrere,</text><text x="144" y="130.3189189189189" class="st2">amb els colors que vulguis.</text><rect x="114" y="137.11891891891892" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="138.11891891891892" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.71891891891892" r="3" class="num"/><text x="118.6" y="142.91891891891893" class="numt">2</text><text x="144" y="145.11891891891892" class="st1">Retalla-la</text><text x="144" y="150.3189189189189" class="st2">sencera, seguint</text><text x="144" y="154.5189189189189" class="st2">la línia negra.</text><rect x="114" y="161.3189189189189" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.3189189189189" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.9189189189189" r="3" class="num"/><text x="118.6" y="167.11891891891892" class="numt">3</text><text x="144" y="169.3189189189189" class="st1">Doblega i enganxa</text><text x="144" y="174.5189189189189" class="st2">per la línia de punts</text><text x="144" y="178.7189189189189" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.51891891891893" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.51891891891893" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="190.11891891891892" r="3" class="num"/><text x="118.6" y="191.31891891891894" class="numt">4</text><text x="144" y="193.51891891891893" class="st1">Munta el suport</text><text x="144" y="198.71891891891892" class="st2">talla la línia vermella</text><text x="144" y="202.9189189189189" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.71891891891892" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.71891891891892" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.3189189189189" r="3" class="num"/><text x="118.6" y="215.51891891891893" class="numt">5</text><text x="144" y="217.71891891891892" class="st1">Encaixa la figura</text><text x="144" y="222.9189189189189" class="st2">fes entrar la peana</text><text x="144" y="227.1189189189189" class="st2">al tall del suport.</text><rect x="114" y="233.9189189189189" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.9189189189189" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.5189189189189" r="3" class="num"/><text x="118.6" y="239.71891891891892" class="numt">6</text><text x="144" y="241.9189189189189" class="st1">Escaneja el QR</text><text x="144" y="247.1189189189189" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.31891891891888" class="st2">del suport.</text><rect x="114" y="258.1189189189189" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="259.1189189189189" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.7189189189189" r="3" class="num"/><text x="118.6" y="263.9189189189189" class="numt">7</text><text x="144" y="266.1189189189189" class="st1">Escolta l'obra!</text><text x="144" y="271.3189189189189" class="st2">i exposa la figura</text><text x="144" y="275.51891891891887" class="st2">amb tota la classe.</text>
