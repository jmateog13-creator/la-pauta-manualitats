<text x="15" y="15" class="h1">A. Schönberg · La figura</text>
<text x="195" y="15" class="h2" text-anchor="end">La Pauta · Compositors · Segle XX</text>
<line x1="15" y1="18" x2="195" y2="18" class="rule"/>
<g id="peca"><image href="fitxes/schoenberg-peca.png" x="34.62" y="26.55" width="54.75" height="246.90"/>
<text x="62.00" y="136.26" class="nom" style="font-size:6.75px">A. Schönberg</text><text x="62.00" y="144.50" class="obra" style="font-size:4.606496395835188px">Serie de 12 notes</text><g transform="rotate(180 62.00 162.49)"><text x="62.00" y="161.24" class="nom" style="font-size:6.75px">A. Schönberg</text><text x="62.00" y="169.48" class="obra" style="font-size:4.4px">Segle XX · 1874 – 1951</text></g><line x1="37.53" y1="150.00" x2="86.47" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.65658093797276,54 66.65658093797276,61 5,61" class="tab"/><rect x="0" y="0" width="71.65658093797276" height="54" fill="#fff"/><rect x="0" y="18" width="71.65658093797276" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.65658093797276" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">SEGLE XX</text><text x="19" y="30.4" class="dates">1874 – 1951</text><text x="68.65658093797276" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.82829046898638 9.0)"><rect x="0" y="14.8" width="71.65658093797276" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.82829046898638" y="8" class="lloc">A. Schönberg</text><text x="35.82829046898638" y="12.2" class="esc2" text-anchor="middle">Viena · Califòrnia · 1874 – 1951</text></g><rect x="0" y="0" width="71.65658093797276" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.65658093797276" y2="36" class="fold"/><line x1="0" y1="54" x2="71.65658093797276" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.65658093797276" y1="18" x2="71.65658093797276" y2="18" class="fold"/><line x1="7" y1="18" x2="64.65658093797276" y2="18" class="slit"/><text x="35.82829046898638" y="46.0" class="lbl">base (no es veu)</text><text x="35.82829046898638" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.65658093797276" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.65658093797276" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.65658093797276" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.65658093797276" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.25658093797276" r="3" class="num"/><text x="118.6" y="118.45658093797276" class="numt">1</text><text x="144" y="120.65658093797276" class="st1">Pinta-la</text><text x="144" y="125.85658093797277" class="st2">per davant i per darrere,</text><text x="144" y="130.05658093797277" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.85658093797275" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.85658093797275" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.45658093797275" r="3" class="num"/><text x="118.6" y="142.65658093797276" class="numt">2</text><text x="144" y="144.85658093797275" class="st1">Retalla-la</text><text x="144" y="150.05658093797274" class="st2">sencera, seguint</text><text x="144" y="154.25658093797273" class="st2">la línia negra.</text><rect x="114" y="161.05658093797277" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.05658093797277" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.65658093797276" r="3" class="num"/><text x="118.6" y="166.85658093797278" class="numt">3</text><text x="144" y="169.05658093797277" class="st1">Doblega i enganxa</text><text x="144" y="174.25658093797276" class="st2">per la línia de punts</text><text x="144" y="178.45658093797275" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.25658093797276" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.25658093797276" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.85658093797275" r="3" class="num"/><text x="118.6" y="191.05658093797277" class="numt">4</text><text x="144" y="193.25658093797276" class="st1">Munta el suport</text><text x="144" y="198.45658093797275" class="st2">talla la línia vermella</text><text x="144" y="202.65658093797273" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.45658093797277" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.45658093797277" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.05658093797277" r="3" class="num"/><text x="118.6" y="215.25658093797279" class="numt">5</text><text x="144" y="217.45658093797277" class="st1">Encaixa la figura</text><text x="144" y="222.65658093797276" class="st2">fes entrar la peana</text><text x="144" y="226.85658093797275" class="st2">al tall del suport.</text><rect x="114" y="233.65658093797276" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.65658093797276" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.25658093797276" r="3" class="num"/><text x="118.6" y="239.45658093797277" class="numt">6</text><text x="144" y="241.65658093797276" class="st1">Escaneja el QR</text><text x="144" y="246.85658093797275" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.05658093797274" class="st2">del suport.</text><rect x="114" y="257.85658093797275" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.85658093797275" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.4565809379728" r="3" class="num"/><text x="118.6" y="263.65658093797276" class="numt">7</text><text x="144" y="265.85658093797275" class="st1">Escolta l'obra!</text><text x="144" y="271.05658093797274" class="st2">i exposa la figura</text><text x="144" y="275.2565809379727" class="st2">amb tota la classe.</text>
<text x="105" y="292" class="foot">© Javier Mateo García per a Aulatech</text></svg>