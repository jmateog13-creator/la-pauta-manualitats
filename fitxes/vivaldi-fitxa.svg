<text x="62.00" y="136.27" class="nom" style="font-size:8.00px">A. Vivaldi</text><text x="62.00" y="144.51" class="obra" style="font-size:6.4px">La primavera</text><g transform="rotate(180 62.00 162.48)"><text x="62.00" y="161.24" class="nom" style="font-size:8.00px">A. Vivaldi</text><text x="62.00" y="169.47" class="obra" style="font-size:4.4px">Barroc · 1678 – 1741</text></g><line x1="37.52" y1="150.00" x2="86.48" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.73125956144824,54 66.73125956144824,61 5,61" class="tab"/><rect x="0" y="0" width="71.73125956144824" height="54" fill="#fff"/><rect x="0" y="18" width="71.73125956144824" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.73125956144824" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">BARROC</text><text x="19" y="30.4" class="dates">1678 – 1741</text><text x="68.73125956144824" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.86562978072412 9.0)"><rect x="0" y="14.8" width="71.73125956144824" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.86562978072412" y="8" class="lloc">A. Vivaldi</text><text x="35.86562978072412" y="12.2" class="esc2" text-anchor="middle">Venècia · Viena · 1678 – 1741</text></g><rect x="0" y="0" width="71.73125956144824" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.73125956144824" y2="36" class="fold"/><line x1="0" y1="54" x2="71.73125956144824" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.73125956144824" y1="18" x2="71.73125956144824" y2="18" class="fold"/><line x1="7" y1="18" x2="64.73125956144824" y2="18" class="slit"/><text x="35.86562978072412" y="46.0" class="lbl">base (no es veu)</text><text x="35.86562978072412" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.73125956144824" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.73125956144824" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.73125956144824" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.73125956144824" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.33125956144823" r="3" class="num"/><text x="118.6" y="118.53125956144824" class="numt">1</text><text x="144" y="120.73125956144824" class="st1">Pinta-la</text><text x="144" y="125.93125956144824" class="st2">per davant i per darrere,</text><text x="144" y="130.13125956144825" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.93125956144823" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.93125956144823" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.53125956144822" r="3" class="num"/><text x="118.6" y="142.73125956144824" class="numt">2</text><text x="144" y="144.93125956144823" class="st1">Retalla-la</text><text x="144" y="150.13125956144822" class="st2">sencera, seguint</text><text x="144" y="154.3312595614482" class="st2">la línia negra.</text><rect x="114" y="161.13125956144825" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.13125956144825" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.73125956144824" r="3" class="num"/><text x="118.6" y="166.93125956144826" class="numt">3</text><text x="144" y="169.13125956144825" class="st1">Doblega i enganxa</text><text x="144" y="174.33125956144823" class="st2">per la línia de punts</text><text x="144" y="178.53125956144822" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.33125956144823" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.33125956144823" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.93125956144823" r="3" class="num"/><text x="118.6" y="191.13125956144825" class="numt">4</text><text x="144" y="193.33125956144823" class="st1">Munta el suport</text><text x="144" y="198.53125956144822" class="st2">talla la línia vermella</text><text x="144" y="202.7312595614482" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.53125956144822" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.53125956144822" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.13125956144822" r="3" class="num"/><text x="118.6" y="215.33125956144823" class="numt">5</text><text x="144" y="217.53125956144822" class="st1">Encaixa la figura</text><text x="144" y="222.7312595614482" class="st2">fes entrar la peana</text><text x="144" y="226.9312595614482" class="st2">al tall del suport.</text><rect x="114" y="233.73125956144824" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.73125956144824" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.33125956144823" r="3" class="num"/><text x="118.6" y="239.53125956144825" class="numt">6</text><text x="144" y="241.73125956144824" class="st1">Escaneja el QR</text><text x="144" y="246.93125956144823" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.13125956144822" class="st2">del suport.</text><rect x="114" y="257.9312595614482" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.9312595614482" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.5312595614482" r="3" class="num"/><text x="118.6" y="263.7312595614482" class="numt">7</text><text x="144" y="265.9312595614482" class="st1">Escolta l'obra!</text><text x="144" y="271.1312595614482" class="st2">i exposa la figura</text><text x="144" y="275.3312595614482" class="st2">amb tota la classe.</text>
