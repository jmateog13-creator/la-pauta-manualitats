<text x="62.00" y="136.28" class="nom" style="font-size:6.74px">W. A. Mozart</text><text x="62.00" y="144.51" class="obra" style="font-size:3.2624937406109162px">Petita serenata nocturna</text><g transform="rotate(180 62.00 162.47)"><text x="62.00" y="161.23" class="nom" style="font-size:6.74px">W. A. Mozart</text><text x="62.00" y="169.46" class="obra" style="font-size:4.4px">Classicisme · 1756 – 1791</text></g><line x1="37.53" y1="150.00" x2="86.47" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.70605908863295,54 66.70605908863295,61 5,61" class="tab"/><rect x="0" y="0" width="71.70605908863295" height="54" fill="#fff"/><rect x="0" y="18" width="71.70605908863295" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.70605908863295" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">CLASSICISME</text><text x="19" y="30.4" class="dates">1756 – 1791</text><text x="68.70605908863295" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.85302954431648 9.0)"><rect x="0" y="14.8" width="71.70605908863295" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.85302954431648" y="8" class="lloc">W. A. Mozart</text><text x="35.85302954431648" y="12.2" class="esc2" text-anchor="middle">Salzburg · Viena · 1756 – 1791</text></g><rect x="0" y="0" width="71.70605908863295" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.70605908863295" y2="36" class="fold"/><line x1="0" y1="54" x2="71.70605908863295" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.70605908863295" y1="18" x2="71.70605908863295" y2="18" class="fold"/><line x1="7" y1="18" x2="64.70605908863295" y2="18" class="slit"/><text x="35.85302954431648" y="46.0" class="lbl">base (no es veu)</text><text x="35.85302954431648" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.70605908863295" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.70605908863295" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.70605908863295" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.70605908863295" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.30605908863295" r="3" class="num"/><text x="118.6" y="118.50605908863295" class="numt">1</text><text x="144" y="120.70605908863295" class="st1">Pinta-la</text><text x="144" y="125.90605908863296" class="st2">per davant i per darrere,</text><text x="144" y="130.10605908863295" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.90605908863296" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.90605908863296" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.50605908863295" r="3" class="num"/><text x="118.6" y="142.70605908863297" class="numt">2</text><text x="144" y="144.90605908863296" class="st1">Retalla-la</text><text x="144" y="150.10605908863295" class="st2">sencera, seguint</text><text x="144" y="154.30605908863294" class="st2">la línia negra.</text><rect x="114" y="161.10605908863295" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.10605908863295" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.70605908863294" r="3" class="num"/><text x="118.6" y="166.90605908863296" class="numt">3</text><text x="144" y="169.10605908863295" class="st1">Doblega i enganxa</text><text x="144" y="174.30605908863294" class="st2">per la línia de punts</text><text x="144" y="178.50605908863292" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.30605908863294" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.30605908863294" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.90605908863293" r="3" class="num"/><text x="118.6" y="191.10605908863295" class="numt">4</text><text x="144" y="193.30605908863294" class="st1">Munta el suport</text><text x="144" y="198.50605908863292" class="st2">talla la línia vermella</text><text x="144" y="202.7060590886329" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.50605908863295" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.50605908863295" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.10605908863295" r="3" class="num"/><text x="118.6" y="215.30605908863296" class="numt">5</text><text x="144" y="217.50605908863295" class="st1">Encaixa la figura</text><text x="144" y="222.70605908863294" class="st2">fes entrar la peana</text><text x="144" y="226.90605908863293" class="st2">al tall del suport.</text><rect x="114" y="233.70605908863297" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.70605908863297" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.30605908863296" r="3" class="num"/><text x="118.6" y="239.50605908863298" class="numt">6</text><text x="144" y="241.70605908863297" class="st1">Escaneja el QR</text><text x="144" y="246.90605908863296" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.10605908863295" class="st2">del suport.</text><rect x="114" y="257.90605908863296" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.90605908863296" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.506059088633" r="3" class="num"/><text x="118.6" y="263.70605908863297" class="numt">7</text><text x="144" y="265.90605908863296" class="st1">Escolta l'obra!</text><text x="144" y="271.10605908863295" class="st2">i exposa la figura</text><text x="144" y="275.30605908863294" class="st2">amb tota la classe.</text>
<text x="105" y="292" class="foot">© Javier Mateo García per a Aulatech</text></svg>