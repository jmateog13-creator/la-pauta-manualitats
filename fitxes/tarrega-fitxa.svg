<text x="62.00" y="136.27" class="nom" style="font-size:8.00px">F. Tàrrega</text><text x="62.00" y="144.51" class="obra" style="font-size:6.4px">Gran Vals</text><g transform="rotate(180 62.00 162.48)"><text x="62.00" y="161.23" class="nom" style="font-size:8.00px">F. Tàrrega</text><text x="62.00" y="169.47" class="obra" style="font-size:4.4px">Romanticisme · 1852 – 1909</text></g><line x1="37.52" y1="150.00" x2="86.48" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.70658682634732,54 66.70658682634732,61 5,61" class="tab"/><rect x="0" y="0" width="71.70658682634732" height="54" fill="#fff"/><rect x="0" y="18" width="71.70658682634732" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.70658682634732" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">ROMANTICISME</text><text x="19" y="30.4" class="dates">1852 – 1909</text><text x="68.70658682634732" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.85329341317366 9.0)"><rect x="0" y="14.8" width="71.70658682634732" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.85329341317366" y="8" class="lloc">F. Tàrrega</text><text x="35.85329341317366" y="12.2" class="esc2" text-anchor="middle">Vila-real · Granada · 1852 – 1909</text></g><rect x="0" y="0" width="71.70658682634732" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.70658682634732" y2="36" class="fold"/><line x1="0" y1="54" x2="71.70658682634732" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.70658682634732" y1="18" x2="71.70658682634732" y2="18" class="fold"/><line x1="7" y1="18" x2="64.70658682634732" y2="18" class="slit"/><text x="35.85329341317366" y="46.0" class="lbl">base (no es veu)</text><text x="35.85329341317366" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.70658682634732" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.70658682634732" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.70658682634732" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.70658682634732" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.30658682634731" r="3" class="num"/><text x="118.6" y="118.50658682634732" class="numt">1</text><text x="144" y="120.70658682634732" class="st1">Pinta-la</text><text x="144" y="125.90658682634732" class="st2">per davant i per darrere,</text><text x="144" y="130.10658682634732" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.9065868263473" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.9065868263473" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.5065868263473" r="3" class="num"/><text x="118.6" y="142.70658682634732" class="numt">2</text><text x="144" y="144.9065868263473" class="st1">Retalla-la</text><text x="144" y="150.1065868263473" class="st2">sencera, seguint</text><text x="144" y="154.30658682634729" class="st2">la línia negra.</text><rect x="114" y="161.10658682634732" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.10658682634732" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.70658682634732" r="3" class="num"/><text x="118.6" y="166.90658682634734" class="numt">3</text><text x="144" y="169.10658682634732" class="st1">Doblega i enganxa</text><text x="144" y="174.3065868263473" class="st2">per la línia de punts</text><text x="144" y="178.5065868263473" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.3065868263473" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.3065868263473" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.9065868263473" r="3" class="num"/><text x="118.6" y="191.10658682634732" class="numt">4</text><text x="144" y="193.3065868263473" class="st1">Munta el suport</text><text x="144" y="198.5065868263473" class="st2">talla la línia vermella</text><text x="144" y="202.7065868263473" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.5065868263473" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.5065868263473" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.1065868263473" r="3" class="num"/><text x="118.6" y="215.3065868263473" class="numt">5</text><text x="144" y="217.5065868263473" class="st1">Encaixa la figura</text><text x="144" y="222.7065868263473" class="st2">fes entrar la peana</text><text x="144" y="226.90658682634728" class="st2">al tall del suport.</text><rect x="114" y="233.70658682634732" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.70658682634732" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.3065868263473" r="3" class="num"/><text x="118.6" y="239.50658682634733" class="numt">6</text><text x="144" y="241.70658682634732" class="st1">Escaneja el QR</text><text x="144" y="246.9065868263473" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.1065868263473" class="st2">del suport.</text><rect x="114" y="257.9065868263473" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.9065868263473" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.5065868263473" r="3" class="num"/><text x="118.6" y="263.7065868263473" class="numt">7</text><text x="144" y="265.9065868263473" class="st1">Escolta l'obra!</text><text x="144" y="271.10658682634727" class="st2">i exposa la figura</text><text x="144" y="275.30658682634726" class="st2">amb tota la classe.</text>
<text x="105" y="292" class="foot">© Javier Mateo García per a Aulatech</text></svg>