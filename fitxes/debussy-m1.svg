a"/><rect x="77.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="89.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="113.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="125.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="149.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="161.16" y="50" width="7.68" height="48.0" class="negra"/><rect x="173.16" y="50" width="7.68" height="48.0" class="negra"/><text x="105.00" y="44.00" class="guia" text-anchor="middle" >Pinta de negre les 5 tecles negres de cada grup (2 + 3) i toca-les amb un teclat o una app.</text><text x="105.00" y="140.00" class="guia" text-anchor="middle" >Si toques NOMÉS les tecles negres, sempre sona bé: és una escala de 5 notes, la PENTATÒNICA.</text><text x="105.00" y="147.00" class="guia" text-anchor="middle" >Debussy la feia servir perquè sonés com la música de l'Àsia que va sentir a París.</text></g>
