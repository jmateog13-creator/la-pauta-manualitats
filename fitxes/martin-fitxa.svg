<text x="15" y="15" class="h1">Martín i Soler · La figura</text>
<text x="195" y="15" class="h2" text-anchor="end">La Pauta · Compositors · Classicisme</text>
<line x1="15" y1="18" x2="195" y2="18" class="rule"/>
<g id="peca"><image href="fitxes/martin-peca.png" x="34.59" y="26.54" width="54.83" height="246.93"/>
<text x="62.00" y="136.28" class="nom" style="font-size:5.78px">Martín i Soler</text><text x="62.00" y="144.51" class="obra" style="font-size:6.023529411764707px">Una cosa rara</text><g transform="rotate(180 62.00 162.48)"><text x="62.00" y="161.23" class="nom" style="font-size:5.78px">Martín i Soler</text><text x="62.00" y="169.46" class="obra" style="font-size:4.4px">Classicisme · 1754 – 1806</text></g><line x1="37.53" y1="150.00" x2="86.47" y2="150.00" class="fold"/></g>
<g id="suport"><g transform="translate(179 30) rotate(90)"><polygon points="0,54 71.73303167420815,54 66.73303167420815,61 5,61" class="tab"/><rect x="0" y="0" width="71.73303167420815" height="54" fill="#fff"/><rect x="0" y="18" width="71.73303167420815" height="18" fill="#fff"/><rect x="0" y="32.8" width="71.73303167420815" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><rect x="4" y="19.4" width="12" height="12" class="qr"/><text x="10" y="26.4" class="qrt">QR</text><text x="19" y="25.6" class="epoca">CLASSICISME</text><text x="19" y="30.4" class="dates">1754 – 1806</text><text x="68.73303167420815" y="30.4" class="esc2" text-anchor="end">Escolta-la!</text><g transform="rotate(180 35.866515837104075 9.0)"><rect x="0" y="14.8" width="71.73303167420815" height="3.2" fill="#fff" stroke="#222" stroke-width=".25"/><text x="35.866515837104075" y="8" class="lloc">Martín i Soler</text><text x="35.866515837104075" y="12.2" class="esc2" text-anchor="middle">València · Viena · 1754 – 1806</text></g><rect x="0" y="0" width="71.73303167420815" height="54" class="cut" style="fill:none"/><line x1="0" y1="36" x2="71.73303167420815" y2="36" class="fold"/><line x1="0" y1="54" x2="71.73303167420815" y2="54" class="fold"/><line x1="0" y1="18" x2="7" y2="18" class="fold"/><line x1="64.73303167420815" y1="18" x2="71.73303167420815" y2="18" class="fold"/><line x1="7" y1="18" x2="64.73303167420815" y2="18" class="slit"/><text x="35.866515837104075" y="46.0" class="lbl">base (no es veu)</text><text x="35.866515837104075" y="58.8" class="lbl">posa-hi cola</text></g></g>
<text x="114" y="109.73303167420815" class="stepH">COM ES MUNTA</text><image href="img/gestos/pose8.png" x="181" y="96.73303167420815" width="14" height="14" preserveAspectRatio="xMidYMid meet"/><rect x="114" y="112.73303167420815" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose1.png" x="120" y="113.73303167420815" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="117.33303167420814" r="3" class="num"/><text x="118.6" y="118.53303167420815" class="numt">1</text><text x="144" y="120.73303167420815" class="st1">Pinta-la</text><text x="144" y="125.93303167420815" class="st2">per davant i per darrere,</text><text x="144" y="130.13303167420815" class="st2">amb els colors que vulguis.</text><rect x="114" y="136.93303167420814" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose2.png" x="120" y="137.93303167420814" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="141.53303167420813" r="3" class="num"/><text x="118.6" y="142.73303167420815" class="numt">2</text><text x="144" y="144.93303167420814" class="st1">Retalla-la</text><text x="144" y="150.13303167420813" class="st2">sencera, seguint</text><text x="144" y="154.33303167420812" class="st2">la línia negra.</text><rect x="114" y="161.13303167420815" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose3.png" x="120" y="162.13303167420815" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="165.73303167420815" r="3" class="num"/><text x="118.6" y="166.93303167420817" class="numt">3</text><text x="144" y="169.13303167420815" class="st1">Doblega i enganxa</text><text x="144" y="174.33303167420814" class="st2">per la línia de punts</text><text x="144" y="178.53303167420813" class="st2">i enganxa les dues cares.</text><rect x="114" y="185.33303167420814" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose4.png" x="120" y="186.33303167420814" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="189.93303167420814" r="3" class="num"/><text x="118.6" y="191.13303167420815" class="numt">4</text><text x="144" y="193.33303167420814" class="st1">Munta el suport</text><text x="144" y="198.53303167420813" class="st2">talla la línia vermella</text><text x="144" y="202.73303167420812" class="st2">i doblega'l en prisma.</text><rect x="114" y="209.53303167420813" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose5.png" x="120" y="210.53303167420813" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="214.13303167420813" r="3" class="num"/><text x="118.6" y="215.33303167420814" class="numt">5</text><text x="144" y="217.53303167420813" class="st1">Encaixa la figura</text><text x="144" y="222.73303167420812" class="st2">fes entrar la peana</text><text x="144" y="226.9330316742081" class="st2">al tall del suport.</text><rect x="114" y="233.73303167420815" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose6.png" x="120" y="234.73303167420815" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="238.33303167420814" r="3" class="num"/><text x="118.6" y="239.53303167420816" class="numt">6</text><text x="144" y="241.73303167420815" class="st1">Escaneja el QR</text><text x="144" y="246.93303167420814" class="st2">amb el mòbil o la tauleta</text><text x="144" y="251.13303167420813" class="st2">del suport.</text><rect x="114" y="257.9330316742081" width="81" height="22" rx="3" class="box"/><image href="img/gestos/pose7.png" x="120" y="258.9330316742081" width="22" height="20" preserveAspectRatio="xMidYMid meet"/><circle cx="118.6" cy="262.53303167420813" r="3" class="num"/><text x="118.6" y="263.7330316742081" class="numt">7</text><text x="144" y="265.9330316742081" class="st1">Escolta l'obra!</text><text x="144" y="271.1330316742081" class="st2">i exposa la figura</text><text x="144" y="275.3330316742081" class="st2">amb tota la classe.</text>
